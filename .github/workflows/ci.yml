name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs of this workflow on the same ref. On pull requests a
# new push cancels the still-running (or stuck/queued) previous run, which also
# clears orphaned runs left behind by an Actions outage. Pushes to main are
# never cancelled so coverage/OIDC upload jobs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege by default: the whole workflow only needs read access to the
# repo. The one job that comments on PRs / uploads coverage via OIDC elevates its
# own permissions below (Token-Permissions hardening for OpenSSF Scorecard).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-build:
    name: ci-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # Canonical CI build (no product flavors).
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ci-test:
    name: ci-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      # Post/update the coverage summary comment on pull requests.
      pull-requests: write
      # Codecov's tokenless (OIDC) upload.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # ── Coverage (Kover) ──────────────────────────────────────────────────────
      # Generate a JaCoCo-compatible XML report from the debug unit tests.
      - name: Generate coverage report
        run: ./gradlew :app:koverXmlReportDebug --no-daemon

      # Post/update a coverage summary comment on the pull request.
      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/app/build/reports/kover/reportDebug.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🧪 Test coverage"
          update-comment: true

      # Upload to Codecov for the trend graph + README badge (tokenless OIDC
      # upload works for public repositories).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: app/build/reports/kover/reportDebug.xml
          flags: unittests
          fail_ci_if_error: false
          use_oidc: true

      # Keep the raw report as a downloadable artifact.
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: app/build/reports/kover/reportDebug.xml
          if-no-files-found: warn

