name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege by default: the whole workflow only needs read access to the
# repo. The one job that comments on PRs / uploads coverage via OIDC elevates its
# own permissions below (Token-Permissions hardening for OpenSSF Scorecard).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-build:
    name: ci-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # Canonical CI build (no product flavors).
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ci-test:
    name: ci-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      # Post/update the coverage summary comment on pull requests.
      pull-requests: write
      # Codecov's tokenless (OIDC) upload.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # ── Coverage (Kover) ──────────────────────────────────────────────────────
      # Generate a JaCoCo-compatible XML report from the debug unit tests.
      - name: Generate coverage report
        run: ./gradlew :app:koverXmlReportDebug --no-daemon

      # Post/update a coverage summary comment on the pull request.
      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/app/build/reports/kover/reportDebug.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🧪 Test coverage"
          update-comment: true

      # Upload to Codecov for the trend graph + README badge (tokenless OIDC
      # upload works for public repositories).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: app/build/reports/kover/reportDebug.xml
          flags: unittests
          fail_ci_if_error: false
          use_oidc: true

      # Keep the raw report as a downloadable artifact.
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: app/build/reports/kover/reportDebug.xml
          if-no-files-found: warn

